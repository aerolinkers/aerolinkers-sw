{% extends "base_layout.html" %}

{% block content %}
<div class="page-container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
  <div style="text-align: center;">
    <h1 style="
      font-size: 120px;
      font-weight: 800;
      color: #0EA5E9;
      margin: 0 0 16px 0;
      opacity: 0.3;
    ">404</h1>

    <h2 style="
      font-size: 32px;
      font-weight: 700;
      color: #F9FAFB;
      margin: 0 0 12px 0;
    ">Page Not Found</h2>

    <p style="
      font-size: 16px;
      color: #9CA3AF;
      margin: 0 0 24px 0;
      max-width: 400px;
    ">The page you're looking for doesn't exist or has been moved.</p>

    <a href="{{ url_for('dashboard') }}" style="
      background: linear-gradient(135deg, #0EA5E9, #06B6D4);
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-block;
      transition: all 200ms ease;
    "
    onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 25px rgba(14, 165, 233, 0.3)';"
    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';"
    >← Back to Dashboard</a>
  </div>
</div>
{% endblock %}
